name: Build macOS DMG
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      BUILD_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt 'pyinstaller>=6.11,<7'
      - name: Validate source and Tk
        run: |
          python -m compileall -q boro_ocr.py scripts
          python boro_ocr.py --self-test source-test.json
      - name: Build, launch bundled app and verify DMG
        run: bash scripts/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BoroOCR-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
  release:
    name: Publish downloadable installers
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: BoroOCR-*
          path: installers
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          RELEASE_TAG: v0.1.${{ github.run_number }}
        run: |
          cat > notes.md <<'EOF'
          Python суулгах шаардлагагүй BoroOCR macOS програм.

          - Apple Silicon (M-series): BoroOCR-arm64.dmg
          - Intel: BoroOCR-x86_64.dmg
          - macOS 15 буюу шинэ хувилбар.

          DMG нээгээд BoroOCR.app-ийг Applications руу чирнэ.
          Эхний хувилбар Apple notarization-гүй: шаардлагатай бол System Settings → Privacy & Security → Open Anyway.
          Screen Recording зөвшөөрөл өгч програмаа дахин нээгээд өөрийн Groq API key оруулна.
          Сонгосон хэсгийн зураг Groq руу илгээгдэнэ. Интернэт шаардлагатай.

          CI нь багцалсан програмын UI/Tk/Pillow/SDK startup болон DMG бүтцийг шалгасан.
          Бодит хэрэглэгчийн дэлгэцийн capture, зөвшөөрөл болон амьд AI хариултыг CI шалгаагүй.
          EOF
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" installers/* --clobber
          else
            gh release create "$RELEASE_TAG" installers/* --target "$BUILD_SHA" --title "BoroOCR $RELEASE_TAG" --notes-file notes.md
          fi
